<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Shop PK - Realtime Admin & Product Manager</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #121824;
      --inner-card-bg: #182030;
      --border-cyan: #00f2fe;
      --border-dark: #1f293d;
      --primary-pink: #fe2c55;
      --primary-pink-hover: #e02648;
      --text-white: #ffffff;
      --text-gray: #8d9bb0;
      --status-green: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background-color: #070a10;
      border-bottom: 1px solid var(--border-dark);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .logo-container svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .logo-container span.pk-tag {
      background-color: var(--primary-pink);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 800;
      margin-left: 4px;
    }

    .header-btn {
      background-color: transparent;
      border: 1px solid var(--border-cyan);
      color: var(--border-cyan);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .header-btn:hover {
      background-color: rgba(0, 242, 254, 0.1);
    }

    /* Main Content Layout */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Outer Admin Panel Frame */
    .admin-frame {
      background-color: var(--card-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.08);
    }

    /* Title & Logout Row */
    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--border-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title svg {
      fill: var(--border-cyan);
      width: 22px;
      height: 22px;
    }

    .btn-logout {
      background-color: var(--primary-pink);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-logout:hover {
      background-color: var(--primary-pink-hover);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }

    .metric-card {
      background-color: var(--inner-card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 25px;
      text-align: center;
    }

    .metric-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-gray);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .metric-value-cyan {
      font-size: 38px;
      font-weight: 800;
      color: var(--border-cyan);
    }

    .metric-value-green {
      font-size: 32px;
      font-weight: 800;
      color: var(--status-green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Form Section */
    .form-card {
      background-color: var(--inner-card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 25px;
    }

    .form-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      background-color: #0b101a;
      border: 1px solid var(--border-dark);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--border-cyan);
    }

    .btn-submit {
      background-color: var(--border-cyan);
      color: #0a0e17;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 1 1-2.896-2.892c.31 0 .611.049.896.14V9.387a6.326 6.326 0 0 0-.896-.065 6.341 6.341 0 1 0 6.341 6.341V8.658a8.21 8.21 0 0 0 4.77 1.519V6.732a4.83 4.83 0 0 1-1.000-.046z"/>
      </svg>
      TikTok Shop <span class="pk-tag">PK</span>
    </div>

    <button class="header-btn" onclick="toggleAnalytics()">
      🔒 Admin & Analytics
    </button>
  </header>

  <!-- Main Portal -->
  <main>
    <div class="admin-frame">
      
      <!-- Panel Title Bar -->
      <div class="panel-header-row">
        <div class="panel-title">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          Realtime Admin & Product Manager
        </div>
        <button class="btn-logout" onclick="logoutAdmin()">Logout Admin</button>
      </div>

      <!-- Top Metric Cards Row -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">TOTAL PRODUCTS</div>
          <div class="metric-value-cyan" id="totalProductsVal">24</div>
        </div>

        <div class="metric-card">
          <div class="metric-label">DATABASE STATUS</div>
          <div class="metric-value-green">
            Connected ⚡
          </div>
        </div>
      </div>

      <!-- Live Sync Form -->
      <div class="form-card">
        <div class="form-title">
          ➕ Add / Edit Product (Live Sync)
        </div>

        <form id="liveProductForm" onsubmit="handleLiveSync(event)">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" class="form-input" id="pName" placeholder="Enter Product Title or TikTok Package Name" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Price (PKR)</label>
              <input type="number" class="form-input" id="pPrice" placeholder="4500" required>
            </div>
            <div class="form-group">
              <label>Media / Image URL</label>
              <input type="url" class="form-input" id="pMedia" placeholder="https://..." required>
            </div>
          </div>

          <button type="submit" class="btn-submit">Sync Product Live</button>
        </form>
      </div>

    </div>
  </main>

  <script>
    function logoutAdmin() {
      if (confirm("Are you sure you want to logout from Admin Panel?")) {
        alert("Logged out successfully.");
      }
    }

    function toggleAnalytics() {
      alert("Realtime Analytics & Sync System Active.");
    }

    function handleLiveSync(e) {
      e.preventDefault();
      let pName = document.getElementById('pName').value;
      let countEl = document.getElementById('totalProductsVal');
      let currentCount = parseInt(countEl.innerText);

      countEl.innerText = currentCount + 1;
      alert('Product "' + pName + '" live synced to TikTok Shop PK database!');
      document.getElementById('liveProductForm').reset();
    }
  </script>
</body>
</html>
